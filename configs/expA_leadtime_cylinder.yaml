# ==========================================================================
# Experiment A — RQ3/RQ4, unseen lead time, on Cylinder.
#
# Same protocol as configs/expA_leadtime_gray_scott.yaml; read that header
# first. Cylinder is included because it is the one dataset in the study whose
# discriminative range plausibly extends past h = 128, which is the range where
# an interpolation test can actually discriminate.
#
# BEFORE RUNNING: check the probe.
#   python scripts/probe_timescales.py --config configs/cylinder.yaml
# and move the interpolation points into the range where E_pers(h) is still
# rising. If the shedding period turns out to be ~300 frames, the interesting
# unseen horizons are 24-256, not 2-12, and the grid below should shift up.
# The grid as written spans both possibilities so it is informative either way,
# at the cost of some columns being flat.
#
# A quasi-periodic flow adds one hazard the combustion datasets do not have.
# If the shedding period P is close to a trained horizon, a model can score
# well at h = P + k for the wrong reason: the field at t + P looks like the
# field at t. Report the measured P alongside this table, and read any
# suspiciously good column at h ~ P against the persistence baseline, which
# enjoys exactly the same coincidence.
# ==========================================================================

_base_: cylinder.yaml

meta:
  model_name: dt_fno
  model_variant: dt_fno

data:
  horizon_sampling: explicit
  train_horizons: [1, 4, 16, 64, 128]
  h_max_train: 128
  eval_horizons: [1, 2, 3, 4, 6, 8, 10, 12, 16, 24, 32, 48, 64, 96, 128,
                  160, 192, 256, 384, 512]
  val_horizons: [1, 4, 16, 64]
  eval_stride: 100

training:
  use_semigroup: false
  use_identity: false

experiment:
  exp_name: cyl_leadtime_dt_fno
  save_dir: ./checkpoints/cyl_leadtime_dt_fno
  tb_dir: ./runs/cyl_leadtime_dt_fno
