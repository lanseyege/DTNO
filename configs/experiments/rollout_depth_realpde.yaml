# ICLR 2027 revision: fixed-depth AR rollout sweep on RealPDEBench combustion.
# See rollout_depth_gray_scott.yaml for the experimental logic.
_base_: ../base.yaml

meta:
  model_variant: ar_fno_r
  model_name: ar_fno

data:
  ar_rollout: 4
  ar_random_rollout: false
  horizon_sampling: fixed
  fixed_horizon: 1
  batch_size: 4
  batch_size_eval: 8

training:
  ar_step_weights: uniform

experiment:
  exp_name: rollout_depth_realpde_R4
  save_dir: ./checkpoints/rollout_depth_realpde_R4
  tb_dir: ./runs/rollout_depth_realpde_R4
  results_dir: ./results
